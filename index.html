const $=s=>document.querySelector(s),app=$("#app");let S,view;
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
function start(){S={c:0,q:0,hp:100,score:0,streak:0,res:C.map(()=>[0,0]),max:0};lessonV()}
function head(){return `<div class="hud"><b>${C[S.c].day} • ${C[S.c].n}</b><button class="btn s" style="padding:4px 12px;margin:0" id="nt">สมุดความรู้</button></div>
<div class="days">${C.map((_,i)=>`<i class="${i<S.c?"d":i===S.c?"c":""}"></i>`).join("")}</div>
<div class="hud">สุขภาพแปลง<div class="bar" role="progressbar" aria-valuenow="${S.hp}" aria-valuemin="0" aria-valuemax="100"><i style="width:${S.hp}%${S.hp<=30?";background:var(--bad)":""}"></i></div>${S.hp}%<span>คะแนน ${S.score}</span></div>`}
function bind(back){const b=$("#nt");if(b)b.onclick=()=>notes(back)}
function lessonV(msg){const ch=C[S.c];view=lessonV;
app.innerHTML=head()+(msg?`<div class="fb no">${msg}</div>`:"")+`<p>${ch.story}</p><div class="note"><b>สมุดพี่เลี้ยง</b> อ่านก่อนเริ่มภารกิจ ${ch.lesson}</div><button class="btn" id="go">เริ่มภารกิจ (${ch.qs.length} ข้อ)</button>`;bind(lessonV);
S.max=Math.max(S.max,S.c);$("#go").onclick=()=>{S.q=0;S.res[S.c]=[0,0];qV()}}
function qV(){const ch=C[S.c],q=ch.qs[S.q];view=qV;
const o=shuffle([[q[1],1],...q.slice(2,-1).map(x=>[x,0])]);S.cur={o,q};
app.innerHTML=head()+`<p class="tag">ภารกิจ ${S.q+1}/${ch.qs.length} • คอมโบ ×${S.streak}</p><p><b>${q[0]}</b></p>`+o.map((x,i)=>`<button class="opt" data-i="${i}">${x[0]}</button>`).join("")+`<div id="fb"></div>`;bind(qV);
document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>ans(+b.dataset.i))}
function ans(i){const {o,q}=S.cur,ok=o[i][1]===1,ch=C[S.c];
document.querySelectorAll(".opt").forEach((b,m)=>{b.disabled=true;if(o[m][1])b.classList.add("right");else if(m===i)b.classList.add("wrong")});
S.res[S.c][1]++;if(ok){S.res[S.c][0]++;S.streak++;S.score+=100+Math.min(S.streak-1,5)*20}else{S.streak=0;S.hp=Math.max(0,S.hp-15)}
const dead=S.hp<=0,last=S.q===ch.qs.length-1;
$("#fb").innerHTML=`<div class="fb ${ok?"ok":"no"}"><b>${ok?"ถูกต้อง!":"ยังไม่ใช่"}</b><p>${q[q.length-1]}</p>${dead?"<p><b>แปลงเสียหายหนัก ต้องเริ่มบทนี้ใหม่</b></p>":""}</div><p><button class="btn" id="nx">${dead?"เริ่มบทนี้ใหม่":last?(S.c===C.length-1?"ดูผลสรุป":"ไปบทต่อไป"):"ข้อต่อไป"}</button></p>`;
$("#nx").focus();$("#hp");$("#nx").onclick=()=>{if(dead){S.hp=60;lessonV("สุขภาพแปลงเหลือ 60% อ่านสมุดพี่เลี้ยงอีกรอบแล้วลองใหม่")}else if(!last){S.q++;qV()}else if(S.c<C.length-1){S.c++;lessonV()}else end()}}
function notes(back){app.innerHTML=`<h2>สมุดความรู้</h2><p style="color:var(--mute)">สรุปเนื้อหาบทที่เปิดแล้ว</p>`+C.slice(0,S.max+1).map(c=>`<div class="note"><b>${c.day} • ${c.n}</b> ${c.lesson}</div>`).join("")+`<button class="btn" id="bk">กลับไปเล่น</button>`;$("#bk").onclick=()=>back()}
function end(){view=end;const t=S.res.reduce((a,r)=>a+r[0],0),n=C.reduce((a,c)=>a+c.qs.length,0),p=t/n;
const rk=p>=.9?"ปรมาจารย์ไฮโดรโพนิกส์":p>=.75?"ผู้จัดการฟาร์มมืออาชีพ":p>=.55?"พนักงานฝึกหัด":"อ่านสมุดความรู้ซ้ำอีกนิด";
app.innerHTML=`<h1>จบรอบปลูก: ${rk}</h1><p class="big">${S.score}</p><div class="card">`+C.map((c,i)=>`<div class="row"><span>${c.day} ${c.n}</span><b style="color:${S.res[i][0]/S.res[i][1]<.6?"var(--bad)":"var(--ok)"}">${S.res[i][0]}/${S.res[i][1]}</b></div>`).join("")+`</div><p>บทที่แดงคือหัวข้อที่ควรทบทวนในสมุดความรู้</p><button class="btn" id="nb">เปิดสมุดความรู้</button><button class="btn s" id="re">เล่นรอบใหม่</button>`;
$("#nb").onclick=()=>{S.max=C.length-1;notes(end)};$("#re").onclick=start}
function intro(){app.innerHTML=`<h1>ฟาร์มไฮโดรโพนิกส์: 1 รอบปลูก</h1><p>คุณเพิ่งรับช่วงดูแลโรงเรือนสลัด เดินตามรอบปลูกตั้งแต่วันแรกจนปิดรอบ 10 บท แต่ละบทมีสมุดพี่เลี้ยงสรุปความรู้จาก SOP แล้วต้องตัดสินใจให้ถูก ตอบผิดสุขภาพแปลงลด 15% ถ้าเหลือ 0 ต้องเริ่มบทนั้นใหม่</p><div class="note"><ul><li>เปรียบเทียบดินกับไฮโดรฯ และ 5 ปัจจัยสิ่งแวดล้อม</li><li>ติดตั้ง ผสมปุ๋ย AB เพาะกล้า</li><li>ตรวจประจำวัน วินิจฉัยขาดธาตุ 8 ชนิด แถบสีราก/ใบ</li><li>เก็บเกี่ยว ฆ่าเชื้อ แผนฉุกเฉิน และสมุดบันทึก</li></ul></div><button class="btn" id="go">เริ่มวันแรก</button>`;$("#go").onclick=start}
intro();
</script>
